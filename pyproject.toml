[project]
name = "assetto-minimap"
version = "0.1.0"
description = "Waze/GPS Minimap and Telemetry companion for Assetto Corsa & Shutoko Revival Project"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sahar Zolberg" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "psutil>=7.2.2",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.11,<7",
]
test = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
