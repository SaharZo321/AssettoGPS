name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.1.0 or 0.1.1-beta.2"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump version and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Version '$VERSION' doesn't look like X.Y.Z or X.Y.Z-beta.N / -alpha.N / -rc.N" >&2
            exit 1
          fi

      - name: Bump version in tracked files
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/bump_version.py "$VERSION"

      - name: Commit on a release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump-version/v$VERSION"
          git add package.json pyproject.toml ac_app/lua/AssettoGPS/manifest.ini scripts/build_release.ps1
          git commit -m "Bump version to v$VERSION"
          git push origin "bump-version/v$VERSION"

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # main requires PRs + status checks, so we can't push straight to
          # it anymore. Open a PR and let GitHub auto-merge it once the two
          # required checks (which also run on pull_request) pass. The
          # tag-release workflow tags the resulting merge commit and kicks
          # off the Windows build/release.
          gh pr create \
            --base main \
            --head "bump-version/v$VERSION" \
            --title "Bump version to v$VERSION" \
            --body "Automated version bump to v$VERSION. Auto-merges once required checks pass; merging tags the release and triggers the Windows build/publish."
          gh pr merge "bump-version/v$VERSION" --auto --squash
